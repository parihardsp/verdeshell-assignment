[project]
name = "mini-knowledge-assistant"
version = "0.1.0"
description = "FastAPI backend for Mini Knowledge Assistant RAG service"
readme = "README.md"
authors = [
    { name = "Deepak Parihar", email = "parihardeepak700@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "chromadb>=1.5.9",
    "deepeval>=4.3.0",
    "fastapi>=0.115.0",
    "greenlet>=3.5.6",
    "httpx>=0.27.2",
    "langchain-core>=1.6.11",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.2",
    "langsmith>=0.14.11",
    "numpy>=1.26.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "python-multipart>=0.0.12",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.0.36",
    "streamlit>=1.66.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
]
ignore = [
    "E501",
    "UP046",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
